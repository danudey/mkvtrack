name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: mkvtrack

jobs:
  # Keeps a release pull request up to date with the conventional commits on
  # main. Merging that pull request tags the version and creates the release;
  # the build jobs below then attach the binaries to it.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  linux:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - riscv64gc-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The crate and its dependencies are pure Rust, so rust-lld links the
      # musl targets on its own. No cross compiler or container is needed.
      - name: Build
        env:
          RUSTFLAGS: -C linker=rust-lld -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          name="$BIN-${{ needs.release-please.outputs.version }}-${{ matrix.target }}"
          tar -czf "$name.tar.gz" -C "target/${{ matrix.target }}/release" "$BIN"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" $BIN-*.tar.gz $BIN-*.sha256 --clobber

  macos:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Make universal binary
        run: |
          mkdir -p dist
          lipo -create -output "dist/$BIN" \
            "target/aarch64-apple-darwin/release/$BIN" \
            "target/x86_64-apple-darwin/release/$BIN"
          lipo -info "dist/$BIN"

      - name: Package
        run: |
          name="$BIN-${{ needs.release-please.outputs.version }}-macos-universal"
          tar -czf "$name.tar.gz" -C dist "$BIN"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" $BIN-*.tar.gz $BIN-*.sha256 --clobber

  windows:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $name = "$env:BIN-${{ needs.release-please.outputs.version }}-${{ matrix.target }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/$env:BIN.exe" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Out-File -Encoding ascii "$name.zip.sha256"
          "ARCHIVE=$name.zip" | Out-File -Encoding ascii -Append $env:GITHUB_ENV

      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" "$env:ARCHIVE" "$env:ARCHIVE.sha256" --clobber
